<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Đọc Văn Bản - Text to Speech</title>
<style>
  :root {
    --bg-main: #0a0e17;
    --bg-card: #131826;
    --bg-input: #1a2133;
    --accent: #00e5ff;
    --accent-dim: #0097a7;
    --accent-glow: rgba(0, 229, 255, 0.25);
    --text-main: #e6f1ff;
    --text-dim: #7d8aa3;
    --danger: #ff4d6d;
    --danger-dim: #b0233c;
    --success: #00e676;
    --border: #232c42;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Co giãn cho màn hình rất nhỏ (một số máy Android giá rẻ ~320-360px) */
  @media (max-width: 360px) {
    header h1 { font-size: 19px; }
    .card { padding: 12px; }
    textarea { min-height: 150px; font-size: 14px; }
    .btn-main { padding: 15px; font-size: 15px; }
    .btn-sub { padding: 12px; font-size: 14px; }
  }
  /* Màn hình lớn hơn (tablet Android) vẫn giữ layout gọn, không bị kéo giãn quá rộng */
  @media (min-width: 900px) {
    .app { max-width: 720px; }
  }

  html, body {
    height: 100%;
    background: var(--bg-main);
    color: var(--text-main);
    font-family: "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    padding: env(safe-area-inset-top, 16px) 14px calc(env(safe-area-inset-bottom, 16px) + 14px);
    background:
      radial-gradient(circle at 20% 0%, rgba(0,229,255,0.08), transparent 40%),
      radial-gradient(circle at 100% 30%, rgba(0,229,255,0.05), transparent 50%),
      var(--bg-main);
    min-height: 100%;
  }

  .app { max-width: 640px; margin: 0 auto; padding-bottom: 12px; }

  header { text-align: center; padding: 10px 0 18px; }
  header h1 {
    font-size: 22px;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, var(--accent), #7c4dff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { color: var(--text-dim); font-size: 13px; margin-top: 4px; }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }

  .card-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  textarea {
    width: 100%;
    min-height: 180px;
    max-height: 320px;
    resize: vertical;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text-main);
    font-size: 15px;
    line-height: 1.5;
    padding: 12px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  textarea::placeholder { color: var(--text-dim); }

  .textarea-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }

  #charCount.limit-near { color: #ffb300; }
  #charCount.limit-max { color: var(--danger); }

  .btn-clear-small {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-clear-small:active { background: var(--bg-input); }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  select {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 12px;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%2300e5ff' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
    padding-right: 36px;
  }
  select:focus { border-color: var(--accent); }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .btn-main {
    width: 100%;
    padding: 18px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.5px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    color: #001018;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 6px 20px var(--accent-glow);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-main:active { transform: scale(0.98); }
  .btn-main.speaking {
    background: linear-gradient(135deg, #ffb300, #ff7300);
    box-shadow: 0 6px 20px rgba(255,140,0,0.3);
  }
  .btn-main:disabled { opacity: 0.5; }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
  }

  .btn-sub {
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-input);
    color: var(--text-main);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: 0.15s;
  }
  .btn-sub:active { transform: scale(0.97); }
  .btn-sub.danger { color: var(--danger); border-color: rgba(255,77,109,0.4); }
  .btn-sub:disabled { opacity: 0.4; }
  .btn-sub.processing {
    color: var(--accent);
    border-color: var(--accent);
    opacity: 0.8;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 10px;
    min-height: 18px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
  }
  .dot.active { background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 16px) + 20px);
    transform: translateX(-50%) translateY(20px);
    background: #1e2740;
    border: 1px solid var(--accent);
    color: var(--text-main);
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 14px;
    max-width: 90%;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 999;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.error { border-color: var(--danger); }

  footer { text-align: center; color: var(--text-dim); font-size: 11px; padding: 10px 0 4px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🔊 ĐỌC VĂN BẢN</h1>
    <p>Chuyển văn bản thành giọng nói - Miễn phí, không cần mạng</p>
  </header>

  <div class="card">
    <div class="card-title">📝 Văn bản cần đọc</div>
    <textarea id="textInput" maxlength="25000" placeholder="Nhập hoặc dán văn bản vào đây (tối đa 25.000 ký tự)..."></textarea>
    <div class="textarea-footer">
      <span id="charCount">0 / 25.000</span>
      <button class="btn-clear-small" id="btnClearText">🗑 Xóa nhanh</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🎙 Bộ đọc &amp; Giọng nói</div>
    <div class="field">
      <label for="engineSelect">Bộ đọc (Engine / Nhà cung cấp)</label>
      <select id="engineSelect"></select>
    </div>
    <div class="field">
      <label for="voiceSelect">Giọng nói</label>
      <select id="voiceSelect"></select>
    </div>
  </div>

  <div class="card">
    <div class="card-title">⚙️ Tùy chỉnh giọng đọc</div>
    <div class="grid-2">
      <div class="field">
        <label for="rateSelect">Tốc độ đọc</label>
        <select id="rateSelect">
          <option value="0.5">0.5x - Rất chậm</option>
          <option value="0.75">0.75x - Chậm</option>
          <option value="1.0" selected>1.0x - Bình thường</option>
          <option value="1.25">1.25x - Nhanh</option>
          <option value="1.5">1.5x - Khá nhanh</option>
          <option value="2.0">2.0x - Rất nhanh</option>
        </select>
      </div>
      <div class="field">
        <label for="pitchSelect">Cao độ giọng</label>
        <select id="pitchSelect">
          <option value="0.5">0.5 - Trầm nhất</option>
          <option value="0.75">0.75 - Trầm</option>
          <option value="1.0" selected>1.0 - Bình thường</option>
          <option value="1.25">1.25 - Cao</option>
          <option value="1.5">1.5 - Khá cao</option>
          <option value="1.75">1.75 - Cao hơn</option>
          <option value="2.0">2.0 - Cao nhất</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <button class="btn-main" id="btnSpeak">
      <span id="btnSpeakIcon">▶️</span>
      <span id="btnSpeakLabel">ĐỌC VĂN BẢN</span>
    </button>
    <div class="btn-row">
      <button class="btn-sub" id="btnRewind">⏪ Tua lùi</button>
      <button class="btn-sub" id="btnForward">⏩ Tua tới</button>
    </div>
    <div class="btn-row" style="grid-template-columns: 1fr;">
      <button class="btn-sub" id="btnSaveAudio">💾 Lưu âm thanh (file WAV)</button>
    </div>
    <div class="status-bar">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Sẵn sàng</span>
    </div>
  </div>

  <footer>Ứng dụng chạy hoàn toàn ngoại tuyến trên thiết bị của bạn</footer>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  // ---------- Lưới an toàn toàn cục ----------
  // Bắt mọi lỗi JS không lường trước (kể cả lỗi trong promise bị bỏ quên
  // .catch) để hiển thị toast thay vì để WebView hiển thị màn hình trắng
  // hoặc coi như ứng dụng bị treo. Không dùng preventDefault() cho lỗi cú
  // pháp nghiêm trọng (sẽ không tới được đây vì file sẽ không parse được),
  // chỉ áp dụng cho lỗi runtime xảy ra sau khi app đã chạy.
  window.addEventListener('error', function (event) {
    try {
      console.error('Lỗi runtime không mong muốn:', event.error || event.message);
      if (typeof showToast === 'function') {
        showToast('Đã xảy ra lỗi, vui lòng thử lại: ' + (event.message || 'không rõ nguyên nhân'), true);
      }
    } catch (_) { /* không để lỗi trong chính trình xử lý lỗi làm hỏng thêm gì */ }
  });
  window.addEventListener('unhandledrejection', function (event) {
    try {
      const reason = event && event.reason ? (event.reason.message || String(event.reason)) : 'không rõ nguyên nhân';
      console.error('Promise bị từ chối không được xử lý:', reason);
      if (typeof showToast === 'function') {
        showToast('Đã xảy ra lỗi: ' + reason, true);
      }
    } catch (_) { /* bỏ qua */ }
  });

  const textInput = document.getElementById('textInput');
  const charCount = document.getElementById('charCount');
  const btnClearText = document.getElementById('btnClearText');
  const engineSelect = document.getElementById('engineSelect');
  const voiceSelect = document.getElementById('voiceSelect');
  const rateSelect = document.getElementById('rateSelect');
  const pitchSelect = document.getElementById('pitchSelect');
  const btnSpeak = document.getElementById('btnSpeak');
  const btnSpeakIcon = document.getElementById('btnSpeakIcon');
  const btnSpeakLabel = document.getElementById('btnSpeakLabel');
  const btnRewind = document.getElementById('btnRewind');
  const btnForward = document.getElementById('btnForward');
  const btnSaveAudio = document.getElementById('btnSaveAudio');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const toast = document.getElementById('toast');

  const MAX_CHARS = 25000;
  const CHUNK_MAX_LEN = 180;       // độ dài tối đa mỗi đoạn gửi cho TTS (an toàn cho engine Android)
  const KEEPALIVE_MS = 4000;       // chu kỳ "đánh thức" chống bug Android tự treo sau ~15s

  let voicesByEngine = {};   // { engineKey: [voice, voice, ...] }
  let nativeEngineLabels = {}; // { engineKey(package name): label hiển thị } — chỉ dùng khi ttsMode === 'native'
  let allVoices = [];
  let isSpeaking = false;    // đang thực sự phát âm thanh (nút chính đang ở trạng thái ⏹ Dừng)
  let toastTimer = null;
  let keepAliveTimer = null;

  let speechQueue = [];      // mảng các câu/đoạn cần đọc
  let queueIndex = 0;        // đoạn đang đọc / sẽ đọc tiếp
  let lastQueueText = '';    // văn bản đã dùng để xây speechQueue lần gần nhất
  let currentSessionId = 0;  // để phân biệt phiên đọc cũ khi cancel

  const synthSupported = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

  // 'web' = dùng Web Speech API của WebView, 'native' = dùng plugin Kotlin (TextToSpeech gốc Android),
  // 'none' = không có cách nào đọc được trên máy này
  let ttsMode = 'web';

  // ---------- Toast ----------
  function showToast(msg, isError) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.classList.toggle('error', !!isError);
    toast.classList.add('show');
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // ---------- Char counter ----------
  function updateCharCount() {
    const len = textInput.value.length;
    charCount.textContent = len.toLocaleString('vi-VN') + ' / 25.000';
    charCount.classList.remove('limit-near', 'limit-max');
    if (len >= MAX_CHARS) {
      charCount.classList.add('limit-max');
    } else if (len >= MAX_CHARS * 0.9) {
      charCount.classList.add('limit-near');
    }
  }
  textInput.addEventListener('input', updateCharCount);

  btnClearText.addEventListener('click', () => {
    textInput.value = '';
    updateCharCount();
    textInput.focus();
  });

  // ---------- Engine name guess ----------
  // Web Speech API không luôn cung cấp "engine name" rõ ràng.
  // Ta nhóm giọng nói theo voice.name prefix / voiceURI domain / hoặc theo nhà cung cấp suy luận.
  function guessEngineName(voice) {
    const name = voice.name || '';
    const uri = voice.voiceURI || '';
    // Các mẫu phổ biến trên Android: "Google 한국어", "Samsung TTS", "Microsoft ...", v.v.
    if (/google/i.test(name) || /google/i.test(uri)) return 'Google TTS';
    if (/samsung/i.test(name) || /samsung/i.test(uri)) return 'Samsung TTS';
    if (/microsoft/i.test(name) || /microsoft/i.test(uri)) return 'Microsoft TTS';
    if (/amazon|polly/i.test(name)) return 'Amazon TTS';
    if (/apple|siri/i.test(name)) return 'Apple TTS';
    // Nếu voiceURI có dạng "com.xxx.yyy", lấy phần domain giữa làm tên bộ đọc
    const match = uri.match(/^([a-zA-Z0-9]+(\.[a-zA-Z0-9]+){1,2})/);
    if (match) return match[1];
    return 'Bộ đọc hệ thống';
  }

  function isVietnameseVoice(voice) {
    return /^vi(-|_|$)/i.test(voice.lang) || /viet/i.test(voice.name);
  }

  // ---------- Tách văn bản dài thành các đoạn nhỏ để đọc nối tiếp (queue) ----------
  // Nhiều engine TTS trên Android sẽ cắt/bỏ qua văn bản nếu 1 utterance quá dài.
  // Ta tách theo câu (dấu . ! ? … và xuống dòng), rồi gộp các câu ngắn lại
  // cho tới khi gần chạm CHUNK_MAX_LEN, để giọng đọc không bị ngắt quá vụn.
  function splitIntoChunks(text) {
    const normalized = text.replace(/\r\n/g, '\n').trim();
    if (!normalized) return [];

    // Tách theo câu, giữ lại dấu câu.
    // LƯU Ý: cố tình KHÔNG dùng lookbehind (?<=...) ở đây. Một số WebView Android
    // cũ (đặc biệt trên máy không có Google Play Services / chưa cập nhật) không
    // hỗ trợ lookbehind và sẽ ném SyntaxError ngay khi nạp <script>, làm sập toàn
    // bộ ứng dụng chứ không riêng gì tính năng tách câu. Cách dưới đây tương đương
    // về mặt kết quả nhưng dùng regex tương thích ngược.
    const rawSentences = [];
    normalized.split(/\n+/).forEach(line => {
      const trimmedLine = line.trim();
      if (!trimmedLine) return;
      const matches = trimmedLine.match(/[^.!?…]+[.!?…]*/g);
      if (matches) {
        matches.forEach(m => {
          const t = m.trim();
          if (t) rawSentences.push(t);
        });
      }
    });

    const chunks = [];
    let buffer = '';

    rawSentences.forEach(sentence => {
      // Nếu bản thân 1 câu đã quá dài, cắt cứng theo CHUNK_MAX_LEN tại khoảng trắng gần nhất
      if (sentence.length > CHUNK_MAX_LEN) {
        if (buffer) { chunks.push(buffer); buffer = ''; }
        let remaining = sentence;
        while (remaining.length > CHUNK_MAX_LEN) {
          let cut = remaining.lastIndexOf(' ', CHUNK_MAX_LEN);
          if (cut <= 0) cut = CHUNK_MAX_LEN;
          chunks.push(remaining.slice(0, cut).trim());
          remaining = remaining.slice(cut).trim();
        }
        if (remaining) buffer = remaining;
        return;
      }

      if ((buffer + ' ' + sentence).trim().length > CHUNK_MAX_LEN) {
        if (buffer) chunks.push(buffer);
        buffer = sentence;
      } else {
        buffer = (buffer ? buffer + ' ' : '') + sentence;
      }
    });

    if (buffer) chunks.push(buffer);
    return chunks;
  }

  // ---------- Load voices ----------
  function loadVoices() {
    allVoices = window.speechSynthesis.getVoices() || [];
    if (allVoices.length === 0) return false;

    voicesByEngine = {};
    allVoices.forEach(v => {
      const engine = guessEngineName(v);
      if (!voicesByEngine[engine]) voicesByEngine[engine] = [];
      voicesByEngine[engine].push(v);
    });

    // Sắp xếp: bộ đọc có giọng tiếng Việt lên trước
    const engineNames = Object.keys(voicesByEngine).sort((a, b) => {
      const aHasVi = voicesByEngine[a].some(isVietnameseVoice) ? 0 : 1;
      const bHasVi = voicesByEngine[b].some(isVietnameseVoice) ? 0 : 1;
      if (aHasVi !== bHasVi) return aHasVi - bHasVi;
      return a.localeCompare(b);
    });

    engineSelect.innerHTML = '';
    engineNames.forEach(engine => {
      const opt = document.createElement('option');
      opt.value = engine;
      const viCount = voicesByEngine[engine].filter(isVietnameseVoice).length;
      opt.textContent = engine + (viCount > 0 ? ' 🇻🇳 (' + viCount + ' giọng Việt)' : ' (' + voicesByEngine[engine].length + ' giọng)');
      engineSelect.appendChild(opt);
    });

    if (engineNames.length > 0) {
      engineSelect.value = engineNames[0];
      populateVoiceSelect(engineNames[0]);
    }
    return true;
  }

  function populateVoiceSelect(engineName) {
    const voices = voicesByEngine[engineName] || [];
    // Ưu tiên giọng tiếng Việt lên đầu danh sách
    const sorted = [...voices].sort((a, b) => {
      const aVi = isVietnameseVoice(a) ? 0 : 1;
      const bVi = isVietnameseVoice(b) ? 0 : 1;
      if (aVi !== bVi) return aVi - bVi;
      return a.name.localeCompare(b.name);
    });

    voiceSelect.innerHTML = '';
    sorted.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.voiceURI || v.name;
      const flag = isVietnameseVoice(v) ? '🇻🇳 ' : '';
      opt.textContent = flag + v.name + ' (' + v.lang + ')';
      voiceSelect.appendChild(opt);
    });
  }

  engineSelect.addEventListener('change', async () => {
    const engineKey = engineSelect.value;
    populateVoiceSelect(engineKey);

    // Ở chế độ native, mỗi "bộ đọc" là 1 engine Android thật riêng biệt —
    // phải báo cho plugin chuyển engine đang active thì speak()/lưu file
    // mới dùng đúng giọng của bộ đọc vừa chọn (không chỉ đổi mỗi UI).
    if (ttsMode === 'native') {
      const plugin = getNativeTtsPlugin();
      if (!plugin) return;
      engineSelect.disabled = true;
      btnSpeak.disabled = true;
      btnRewind.disabled = true;
      btnForward.disabled = true;
      statusText.textContent = 'Đang chuyển bộ đọc...';
      try {
        await plugin.setEngine({ engineName: engineKey });
        statusText.textContent = 'Sẵn sàng';
      } catch (e) {
        const msg = (e && e.message) ? e.message : String(e);
        showToast('Không thể chuyển sang bộ đọc này: ' + msg, true);
        statusText.textContent = 'Sẵn sàng';
      } finally {
        engineSelect.disabled = false;
        btnSpeak.disabled = false;
        btnRewind.disabled = false;
      btnForward.disabled = false;
      }
    }
  });

  function getSelectedVoice() {
    const key = voiceSelect.value;
    // Tìm trong đúng danh sách giọng của bộ đọc đang chọn trước (tránh
    // trùng tên giữa các bộ đọc khác nhau khi ở chế độ native nhiều engine),
    // rồi mới rơi về tìm trong toàn bộ allVoices như phương án dự phòng.
    const inCurrentEngine = (voicesByEngine[engineSelect.value] || [])
      .find(v => (v.voiceURI || v.name) === key);
    if (inCurrentEngine) return inCurrentEngine;
    return allVoices.find(v => (v.voiceURI || v.name) === key) || null;
  }

  // ---------- Speak logic (hàng đợi từng câu, DÙNG CHUNG cho cả web & native) ----------
  // Nút chính (▶️/⏹) gộp Phát + Dừng làm MỘT nút duy nhất; Tua lùi/Tua tới di
  // chuyển giữa các câu trong hàng đợi, dùng được cả lúc đang đọc lẫn lúc đã dừng.
  function hasUnfinishedQueue() {
    return speechQueue.length > 0 && queueIndex > 0 && queueIndex < speechQueue.length;
  }

  function setSpeakingUI(speaking) {
    isSpeaking = speaking;
    btnSpeak.classList.toggle('speaking', speaking);
    btnSpeakIcon.textContent = speaking ? '⏹' : '▶️';
    btnSpeakLabel.textContent = speaking ? 'DỪNG ĐỌC' : (hasUnfinishedQueue() ? 'TIẾP TỤC ĐỌC' : 'ĐỌC VĂN BẢN');
    btnRewind.disabled = speechQueue.length === 0;
    btnForward.disabled = speechQueue.length === 0;
    statusDot.classList.toggle('active', speaking);
  }

  function updateProgressStatus() {
    if (speechQueue.length === 0) {
      statusText.textContent = 'Sẵn sàng';
      return;
    }
    const shown = Math.min(queueIndex + 1, speechQueue.length);
    statusText.textContent = (isSpeaking ? 'Đang đọc đoạn ' : 'Sẵn sàng đọc đoạn ') + shown + ' / ' + speechQueue.length;
  }

  function stopKeepAlive() {
    if (keepAliveTimer) {
      clearInterval(keepAliveTimer);
      keepAliveTimer = null;
    }
  }

  // Khắc phục lỗi đã biết trên Chrome/WebView Android: speechSynthesis tự
  // "đóng băng" và ngừng phát sau khoảng 15 giây nếu không có tương tác.
  // Giải pháp: định kỳ gọi pause() rồi resume() để "đánh thức" engine.
  function startKeepAlive() {
    stopKeepAlive();
    keepAliveTimer = setInterval(() => {
      if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        window.speechSynthesis.pause();
        window.speechSynthesis.resume();
      }
    }, KEEPALIVE_MS);
  }

  // Xây lại hàng đợi câu từ văn bản hiện tại — CHỈ gọi khi bắt đầu đọc mới
  // hoàn toàn (không gọi lúc tiếp tục/tua, để không mất vị trí đang dừng dở).
  function buildQueue(text) {
    speechQueue = splitIntoChunks(text);
    queueIndex = 0;
    lastQueueText = text;
  }

  function resetQueueState() {
    speechQueue = [];
    queueIndex = 0;
    lastQueueText = '';
    stopKeepAlive();
  }

  // ---------- Nhánh Web Speech API ----------
  function speakNextChunk(sessionId) {
    // Nếu phiên đọc này đã bị hủy bởi một lệnh mới hơn (Dừng/Tua) thì thôi
    if (sessionId !== currentSessionId) return;

    if (queueIndex >= speechQueue.length) {
      stopKeepAlive();
      setSpeakingUI(false);
      statusText.textContent = 'Đã đọc xong';
      return;
    }

    const chunk = speechQueue[queueIndex];
    const utterance = new SpeechSynthesisUtterance(chunk);
    const voice = getSelectedVoice();
    if (voice) {
      utterance.voice = voice;
      utterance.lang = voice.lang;
    } else {
      utterance.lang = 'vi-VN';
    }
    utterance.rate = parseFloat(rateSelect.value);
    utterance.pitch = parseFloat(pitchSelect.value);

    utterance.onstart = () => {
      if (sessionId !== currentSessionId) return;
      setSpeakingUI(true);
      updateProgressStatus();
    };

    utterance.onend = () => {
      if (sessionId !== currentSessionId) return;
      queueIndex += 1;
      speakNextChunk(sessionId);
    };

    utterance.onerror = (e) => {
      if (sessionId !== currentSessionId) return;
      if (e.error === 'canceled' || e.error === 'interrupted') return;
      stopKeepAlive();
      setSpeakingUI(false);
      showToast('Đã xảy ra lỗi khi đọc văn bản: ' + e.error, true);
    };

    window.speechSynthesis.speak(utterance);
  }

  function startSpeakingWeb(text) {
    if (!synthSupported) {
      showToast('Thiết bị hoặc trình duyệt của bạn không hỗ trợ tính năng đọc giọng nói.', true);
      return;
    }
    if (!text || !text.trim()) {
      showToast('Vui lòng nhập văn bản trước khi đọc.', true);
      return;
    }

    window.speechSynthesis.cancel();
    currentSessionId += 1;
    const sessionId = currentSessionId;

    buildQueue(text);
    if (speechQueue.length === 0) {
      showToast('Vui lòng nhập văn bản trước khi đọc.', true);
      return;
    }

    startKeepAlive();
    speakNextChunk(sessionId);
  }

  // ---------- Nhánh plugin native (đọc TỪNG CÂU một, cho phép tua lùi/tua tới) ----------
  // KHÁC với bản cũ (gửi nguyên văn bản cho plugin trong 1 lần gọi): giờ JS tự
  // tách câu bằng splitIntoChunks() y hệt nhánh web, rồi gọi plugin.speak()
  // tuần tự từng câu — nhờ vậy mới biết chính xác "đang ở câu nào" để Tua
  // lùi/Tua tới hoạt động nhất quán giữa 2 chế độ.
  async function speakNextChunkNative(sessionId) {
    if (sessionId !== currentSessionId) return;

    if (queueIndex >= speechQueue.length) {
      setSpeakingUI(false);
      statusText.textContent = 'Đã đọc xong';
      return;
    }

    const plugin = getNativeTtsPlugin();
    if (!plugin) {
      setSpeakingUI(false);
      showToast('Thiết bị hoặc trình duyệt của bạn không hỗ trợ tính năng đọc giọng nói.', true);
      return;
    }

    const chunk = speechQueue[queueIndex];
    const voice = getSelectedVoice();
    setSpeakingUI(true);
    updateProgressStatus();

    try {
      await plugin.speak({
        text: chunk,
        voiceName: voice ? voice.name : '',
        lang: voice ? voice.lang : 'vi-VN',
        rate: parseFloat(rateSelect.value),
        pitch: parseFloat(pitchSelect.value)
      });
    } catch (err) {
      if (sessionId !== currentSessionId) return; // bị hủy do bấm Dừng/Tua giữa chừng
      const msg = (err && err.message) ? err.message : String(err);
      showToast('Lỗi khi đọc văn bản: ' + msg, true);
      setSpeakingUI(false);
      return;
    }

    // QUAN TRỌNG: plugin.speak() ở phía Kotlin LUÔN resolve() (không reject)
    // kể cả khi bị stopSpeaking() hủy giữa chừng (xem doSynthesizeToFile/speak
    // trong TtsFileSaverPlugin.kt) -> bắt buộc phải tự kiểm tra sessionId ở
    // đây, nếu không đoạn vừa bị Dừng/Tua sẽ vẫn tưởng đọc xong rồi tự nhảy
    // sang đọc tiếp đoạn kế, y hệt lỗi đã từng gặp ở nhánh web trước đây.
    if (sessionId !== currentSessionId) return;
    queueIndex += 1;
    speakNextChunkNative(sessionId);
  }

  async function startSpeakingNative(text) {
    const plugin = getNativeTtsPlugin();
    if (!plugin) {
      showToast('Thiết bị hoặc trình duyệt của bạn không hỗ trợ tính năng đọc giọng nói.', true);
      return;
    }
    if (!text || !text.trim()) {
      showToast('Vui lòng nhập văn bản trước khi đọc.', true);
      return;
    }

    try {
      const engineStatus = await plugin.getEngineStatus();
      if (engineStatus && engineStatus.status === 'error') {
        showToast(engineStatus.message || 'Bộ máy Text-to-Speech gặp lỗi và không sẵn sàng.', true);
        return;
      }
    } catch (e) {
      // Plugin cũ không có getEngineStatus: bỏ qua, để speak() tự báo lỗi.
    }

    buildQueue(text);
    if (speechQueue.length === 0) {
      showToast('Vui lòng nhập văn bản trước khi đọc.', true);
      return;
    }

    currentSessionId += 1;
    const sessionId = currentSessionId;
    speakNextChunkNative(sessionId);
  }

  // Dừng HẲN đoạn đang đọc dở (không phải "tạm dừng" nữa — khái niệm pause
  // riêng đã được thay bằng Dừng + Tua lùi/Tua tới). Dùng chung cho cả nút
  // Dừng (đã gộp vào btnSpeak) lẫn lúc Tua cần ngắt đoạn đang đọc trước khi
  // nhảy sang câu khác.
  async function stopCurrentSpeech() {
    currentSessionId += 1; // vô hiệu hóa mọi callback/await đang chờ của đoạn cũ
    stopKeepAlive();
    if (ttsMode === 'native') {
      const plugin = getNativeTtsPlugin();
      if (plugin) {
        try { await plugin.stopSpeaking(); } catch (e) { /* không quan trọng, bỏ qua */ }
      }
    } else if (ttsMode === 'web') {
      window.speechSynthesis.cancel();
    }
  }

  btnSpeak.addEventListener('click', async () => {
    if (ttsMode !== 'native' && ttsMode !== 'web') {
      showToast('Thiết bị hoặc trình duyệt của bạn không hỗ trợ tính năng đọc giọng nói.', true);
      return;
    }

    if (isSpeaking) {
      // Đang đọc -> bấm để DỪNG HẲN. Vẫn giữ nguyên queueIndex để có thể
      // Tua lùi/Tua tới hoặc bấm lại nút này để đọc tiếp đúng từ câu đang dừng.
      await stopCurrentSpeech();
      setSpeakingUI(false);
      statusText.textContent = 'Đã dừng (đoạn ' + (queueIndex + 1) + ' / ' + speechQueue.length + ')';
      return;
    }

    const text = textInput.value;
    // Hàng đợi rỗng, đã đọc hết toàn bộ, hoặc văn bản đã bị sửa từ lúc dừng
    // -> coi như đọc mới hoàn toàn từ đầu.
    if (speechQueue.length === 0 || queueIndex >= speechQueue.length || text !== lastQueueText) {
      if (ttsMode === 'native') {
        await startSpeakingNative(text);
      } else {
        startSpeakingWeb(text);
      }
      return;
    }

    // Còn dang dở (đã dừng giữa chừng, văn bản không đổi) -> đọc tiếp đúng
    // từ câu đang dừng, KHÔNG đọc lại từ đầu.
    currentSessionId += 1;
    const sessionId = currentSessionId;
    if (ttsMode === 'native') {
      speakNextChunkNative(sessionId);
    } else {
      startKeepAlive();
      speakNextChunk(sessionId);
    }
  });

  // ---------- Tua lùi / Tua tới: nhảy giữa các câu trong hàng đợi ----------
  async function seek(delta) {
    if (speechQueue.length === 0) {
      showToast('Chưa có nội dung đang đọc để tua.', true);
      return;
    }
    const wasSpeaking = isSpeaking;
    await stopCurrentSpeech(); // đã tự tăng currentSessionId ở bên trong
    queueIndex = Math.min(Math.max(queueIndex + delta, 0), speechQueue.length - 1);

    if (wasSpeaking) {
      const sessionId = currentSessionId; // dùng lại id vừa tăng trong stopCurrentSpeech()
      if (ttsMode === 'native') {
        speakNextChunkNative(sessionId);
      } else {
        startKeepAlive();
        speakNextChunk(sessionId);
      }
    } else {
      setSpeakingUI(false);
      updateProgressStatus();
    }
  }

  btnRewind.addEventListener('click', () => { seek(-1); });
  btnForward.addEventListener('click', () => { seek(1); });


  // Nếu người dùng chuyển ứng dụng / tắt màn hình, khi quay lại kiểm tra và
  // đồng bộ lại UI cho khớp trạng thái thực tế của engine (tránh kẹt UI).
  document.addEventListener('visibilitychange', () => {
    if (ttsMode !== 'web') return;
    if (document.visibilityState === 'visible') {
      if (!window.speechSynthesis.speaking && isSpeaking) {
        stopKeepAlive();
        setSpeakingUI(false);
      }
    }
  });

  // ---------- Lưu âm thanh ra file (chỉ hoạt động trong bản APK native/Capacitor) ----------
  function getNativeTtsPlugin() {
    // Capacitor tự động bơm window.Capacitor khi chạy trong app APK đã build từ project này.
    // Khi mở bằng trình duyệt thường (Chrome/testing), window.Capacitor sẽ không tồn tại.
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TtsFileSaver) {
      return window.Capacitor.Plugins.TtsFileSaver;
    }
    return null;
  }

  function setSaveButtonState(state) {
    // state: 'idle' | 'processing' | 'disabled'
    btnSaveAudio.classList.toggle('processing', state === 'processing');
    btnSaveAudio.disabled = state === 'processing';
    if (state === 'processing') {
      btnSaveAudio.textContent = '⏳ Đang tạo file âm thanh...';
    } else {
      btnSaveAudio.textContent = '💾 Lưu âm thanh (file WAV)';
    }
  }

  btnSaveAudio.addEventListener('click', async () => {
    const text = textInput.value;
    if (!text || !text.trim()) {
      showToast('Vui lòng nhập văn bản trước khi lưu âm thanh.', true);
      return;
    }

    const plugin = getNativeTtsPlugin();
    if (!plugin) {
      showToast('Tính năng lưu file chỉ hoạt động trong bản APK đã đóng gói (không dùng được khi mở bằng trình duyệt thường).', true);
      return;
    }

    try {
      const engineStatus = await plugin.getEngineStatus();
      if (engineStatus && engineStatus.status === 'error') {
        showToast(engineStatus.message || 'Bộ máy Text-to-Speech gặp lỗi và không sẵn sàng.', true);
        return;
      }
      if (engineStatus && engineStatus.status === 'loading') {
        showToast('Bộ máy Text-to-Speech đang khởi động, vui lòng thử lại sau vài giây.', true);
        return;
      }
    } catch (e) {
      // Plugin cũ không có getEngineStatus: bỏ qua bước kiểm tra trước, để
      // synthesizeToFile() tự báo lỗi nếu engine chưa sẵn sàng.
    }

    const voice = getSelectedVoice();

    try {
      setSaveButtonState('processing');
      const result = await plugin.synthesizeToFile({
        text: text,
        voiceName: voice ? voice.name : '',
        lang: voice ? voice.lang : 'vi-VN',
        rate: parseFloat(rateSelect.value),
        pitch: parseFloat(pitchSelect.value)
      });

      setSaveButtonState('idle');

      if (result && result.uri) {
        showToast('Đã lưu file âm thanh: ' + (result.fileName || 'audio.wav'));
        // Mở hộp thoại chia sẻ / lưu ngay sau khi tạo xong (tùy chọn, không bắt buộc)
        try {
          await plugin.shareFile({ uri: result.uri, fileName: result.fileName || 'audio.wav' });
        } catch (shareErr) {
          // Người dùng hủy chia sẻ không phải lỗi nghiêm trọng, bỏ qua
        }
      } else {
        showToast('Không nhận được đường dẫn file sau khi tạo âm thanh.', true);
      }
    } catch (err) {
      setSaveButtonState('idle');
      const msg = (err && err.message) ? err.message : String(err);
      showToast('Lỗi khi tạo file âm thanh: ' + msg, true);
    }
  });


  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  // Chờ engine native báo "ready" hoặc "error", thăm dò tối đa ~6 giây.
  // Tránh việc báo lỗi ngay lập tức trong khi engine Android vẫn đang khởi
  // tạo bất đồng bộ (thường mất 1-2 giây sau khi app mở).
  async function waitForNativeEngineStatus(plugin, maxWaitMs) {
    const start = Date.now();
    let last = null;
    while (Date.now() - start < maxWaitMs) {
      try {
        last = await plugin.getEngineStatus();
        if (last && (last.status === 'ready' || last.status === 'error')) {
          return last;
        }
      } catch (e) {
        // Nếu plugin còn quá cũ / không có getEngineStatus, coi như không xác
        // định được trạng thái và thử thẳng getVoices() bên dưới.
        return null;
      }
      await delay(400);
    }
    return last;
  }

  async function tryNativeFallback() {
    const plugin = getNativeTtsPlugin();
    if (!plugin) {
      showToast('Thiết bị hoặc trình duyệt của bạn không hỗ trợ tính năng đọc giọng nói.', true);
      btnSpeak.disabled = true;
      btnRewind.disabled = true;
      btnForward.disabled = true;
      statusText.textContent = 'Không hỗ trợ đọc giọng nói';
      ttsMode = 'none';
      return;
    }

    statusText.textContent = 'Đang khởi động bộ đọc...';

    try {
      const engineStatus = await waitForNativeEngineStatus(plugin, 6000);
      if (engineStatus && engineStatus.status === 'error') {
        showToast(engineStatus.message || 'Bộ máy Text-to-Speech gặp lỗi và không sẵn sàng.', true);
        btnSpeak.disabled = true;
        btnRewind.disabled = true;
      btnForward.disabled = true;
        statusText.textContent = 'Không có bộ đọc khả dụng';
        ttsMode = 'none';
        return;
      }
    } catch (e) {
      // Không xác định được trạng thái engine, vẫn thử getVoices() bên dưới
      // để tương thích ngược với plugin cũ hơn.
    }

    // Lấy TOÀN BỘ bộ đọc (engine) cài trên máy kèm TOÀN BỘ giọng đọc của
    // từng bộ đọc — không chỉ mỗi engine mặc định của hệ thống.
    try {
      const result = await plugin.getEnginesWithVoices();
      const engines = (result && result.engines) || [];
      // Chỉ giữ những bộ đọc thực sự có ít nhất 1 giọng đọc dùng được
      // (một số engine cài trên máy nhưng chưa tải gói giọng nào).
      const usable = engines.filter(e => Array.isArray(e.voices) && e.voices.length > 0);

      if (usable.length === 0) {
        showToast('Không tìm thấy giọng đọc nào trên máy. Vào Cài đặt > Ngôn ngữ > Chuyển văn bản thành giọng nói để cài giọng.', true);
        btnSpeak.disabled = true;
        btnRewind.disabled = true;
      btnForward.disabled = true;
        statusText.textContent = 'Không có giọng đọc';
        ttsMode = 'none';
        return;
      }

      ttsMode = 'native';
      voicesByEngine = {};
      nativeEngineLabels = {};
      usable.forEach(e => {
        voicesByEngine[e.name] = e.voices;
        nativeEngineLabels[e.name] = e.label || e.name;
      });
      allVoices = usable.reduce((acc, e) => acc.concat(e.voices), []);

      // Ưu tiên bộ đọc có giọng tiếng Việt lên đầu, giống hệt cách sắp xếp
      // bên nhánh Web Speech API để trải nghiệm nhất quán giữa 2 chế độ.
      const engineKeys = Object.keys(voicesByEngine).sort((a, b) => {
        const aHasVi = voicesByEngine[a].some(isVietnameseVoice) ? 0 : 1;
        const bHasVi = voicesByEngine[b].some(isVietnameseVoice) ? 0 : 1;
        if (aHasVi !== bHasVi) return aHasVi - bHasVi;
        return (nativeEngineLabels[a] || a).localeCompare(nativeEngineLabels[b] || b);
      });

      engineSelect.innerHTML = '';
      engineKeys.forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;
        const voices = voicesByEngine[key];
        const viCount = voices.filter(isVietnameseVoice).length;
        const label = nativeEngineLabels[key] || key;
        opt.textContent = label + (viCount > 0 ? ' 🇻🇳 (' + viCount + ' giọng Việt)' : ' (' + voices.length + ' giọng)');
        engineSelect.appendChild(opt);
      });

      const firstEngineKey = engineKeys[0];
      engineSelect.value = firstEngineKey;
      populateVoiceSelect(firstEngineKey);

      // Nếu bộ đọc tốt nhất (ưu tiên tiếng Việt) không trùng engine mặc định
      // hệ thống đang dùng, chuyển plugin sang đúng engine đó ngay từ đầu.
      if (firstEngineKey && firstEngineKey !== (result.activeEngine || '')) {
        try {
          await plugin.setEngine({ engineName: firstEngineKey });
        } catch (e) {
          // Không chuyển được thì vẫn dùng engine mặc định của hệ thống —
          // không chặn người dùng, chỉ là danh sách giọng hiển thị có thể
          // chưa khớp 100% với giọng thực sự phát ra cho tới khi họ tự đổi
          // bộ đọc trong dropdown.
        }
      }

      btnSpeak.disabled = false;
      btnRewind.disabled = false;
      btnForward.disabled = false;
      statusText.textContent = 'Sẵn sàng';
    } catch (e) {
      // Tương thích ngược: nếu APK được build từ bản plugin cũ hơn (chưa có
      // getEnginesWithVoices), rơi về getVoices() chỉ lấy giọng của engine
      // mặc định — còn hơn là không đọc được gì.
      try {
        const result = await plugin.getVoices();
        const voices = (result && result.voices) || [];
        if (voices.length === 0) {
          showToast('Không tìm thấy giọng đọc nào trên máy. Vào Cài đặt > Ngôn ngữ > Chuyển văn bản thành giọng nói để cài giọng.', true);
          btnSpeak.disabled = true;
          btnRewind.disabled = true;
      btnForward.disabled = true;
          statusText.textContent = 'Không có giọng đọc';
          ttsMode = 'none';
          return;
        }
        ttsMode = 'native';
        allVoices = voices;
        voicesByEngine = { 'Bộ đọc hệ thống Android': voices };
        nativeEngineLabels = { 'Bộ đọc hệ thống Android': 'Bộ đọc hệ thống Android' };
        engineSelect.innerHTML = '';
        const opt = document.createElement('option');
        opt.value = 'Bộ đọc hệ thống Android';
        const viCount = voices.filter(isVietnameseVoice).length;
        opt.textContent = 'Bộ đọc hệ thống Android' + (viCount > 0 ? ' 🇻🇳 (' + viCount + ' giọng Việt)' : ' (' + voices.length + ' giọng)');
        engineSelect.appendChild(opt);
        populateVoiceSelect('Bộ đọc hệ thống Android');
        btnSpeak.disabled = false;
        btnRewind.disabled = false;
      btnForward.disabled = false;
        statusText.textContent = 'Sẵn sàng';
      } catch (e2) {
        const msg = (e2 && e2.message) ? e2.message : String(e2);
        showToast('Không lấy được danh sách giọng đọc: ' + msg, true);
        btnSpeak.disabled = true;
        btnRewind.disabled = true;
      btnForward.disabled = true;
        statusText.textContent = 'Lỗi bộ đọc';
        ttsMode = 'none';
      }
    }
  }

  function init() {
    try {
      updateCharCount();

      if (!synthSupported) {
        tryNativeFallback();
        return;
      }

      ttsMode = 'web';
      if (!loadVoices()) {
        // Một số trình duyệt Android cần chờ sự kiện voiceschanged
        window.speechSynthesis.onvoiceschanged = () => {
          try { loadVoices(); } catch (e) { console.error(e); }
        };
        // fallback: thử lại sau 500ms phòng khi sự kiện không bắn
        setTimeout(() => {
          try { if (allVoices.length === 0) loadVoices(); } catch (e) { console.error(e); }
        }, 500);
        // Nếu sau 2 giây vẫn không có giọng nào -> WebView không hỗ trợ đầy đủ,
        // chuyển sang dùng plugin native để đảm bảo app vẫn đọc được
        setTimeout(() => {
          if (allVoices.length === 0) {
            tryNativeFallback();
          }
        }, 2000);
      }
    } catch (e) {
      console.error('Lỗi khi khởi động ứng dụng:', e);
      showToast('Không thể khởi động bộ đọc giọng nói. Vui lòng khởi động lại ứng dụng.', true);
      statusText.textContent = 'Lỗi khởi động';
      // Thử phương án dự phòng cuối cùng: plugin native, để app vẫn có cơ hội hoạt động.
      tryNativeFallback();
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    try { init(); } catch (e) { console.error(e); }
  });
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    try { init(); } catch (e) { console.error(e); }
  }
})();
</script>
</body>
</html>
