name: Build Android APK

# Chạy tự động mỗi khi có commit mới, hoặc khi bạn tự bấm "Run workflow" trong tab Actions
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn từ repository
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài Java (bắt buộc cho Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cài các gói phụ thuộc (Capacitor)
        run: npm install

      - name: Thêm nền tảng Android vào project Capacitor
        run: npx cap add android

      - name: Bật hỗ trợ biên dịch Kotlin cho project Android
        run: |
          sed -i '0,/dependencies {/{s/dependencies {/dependencies {\n        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24"/}' android/build.gradle
          sed -i "s/apply plugin: 'com.android.application'/apply plugin: 'com.android.application'\napply plugin: 'kotlin-android'/" android/app/build.gradle
          sed -i '0,/dependencies {/{s/dependencies {/dependencies {\n    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"/}' android/app/build.gradle

      - name: Copy plugin native (Kotlin) vào project Android
        run: |
          mkdir -p android/app/src/main/java/com/docdoc/app
          cp native-plugin/TtsFileSaverPlugin.kt android/app/src/main/java/com/docdoc/app/TtsFileSaverPlugin.kt
          cp native-plugin/MainActivity.java android/app/src/main/java/com/docdoc/app/MainActivity.java

      - name: Copy file_paths.xml (cấu hình cho FileProvider)
        run: |
          mkdir -p android/app/src/main/res/xml
          cp native-plugin/res/xml/file_paths.xml android/app/src/main/res/xml/file_paths.xml

      - name: Bổ sung quyền lưu trữ + khai báo FileProvider vào AndroidManifest.xml
        # BẮT BUỘC: nếu thiếu bước này, tính năng "Lưu âm thanh (file WAV)" sẽ
        # CRASH ngay lập tức trên mọi máy Android 9 trở xuống (API <= 28), vì
        # plugin gọi FileProvider.getUriForFile() nhưng project mặc định của
        # Capacitor KHÔNG tự khai báo provider này (chỉ có khi cài thêm
        # @capacitor/camera hoặc @capacitor/filesystem).
        run: python3 scripts/patch_manifest.py

      - name: Đồng bộ Capacitor
        run: npx cap sync android

      - name: Build file APK (bản debug, để cài thử ngay)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Tải APK lên làm "Artifact" để tải về
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
